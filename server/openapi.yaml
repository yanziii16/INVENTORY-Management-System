openapi: 3.0.3
info:
  title: College Management System - Inventory System API
  description: >
    Official API specification for the Inventory
    subsystem. Designed for cross-team integration in SIA Week 6.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development / Mock server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealthStatus
      summary: Health Check Endpoint
      description: Returns the operational status of the server.
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              example:
                status: "ok"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/signup:
    post:
      operationId: signupUser
      summary: Register a new user account
      description: Creates a new user account and returns user details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserPayload'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created successfully
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      operationId: loginUser
      summary: Login and get JWT Access Token
      description: Authenticates user credentials and returns a JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: maria.santos@college.edu
                password:
                  type: string
                  example: securePassword123
      responses:
        '200':
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items:
    get:
      operationId: getAllItems
      summary: Retrieve all inventory items
      description: Returns a list of all inventory items.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: "Computer Equipment"
      responses:
        '200':
          description: Inventory items retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: createItem
      summary: Create a new inventory item
      description: Creates a new item in the college inventory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInventoryItemPayload'
      responses:
        '201':
          description: Inventory item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          description: Invalid inventory item data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/{itemId}:
    get:
      operationId: getItemById
      summary: Get inventory item by ID
      description: Returns a specific inventory item.
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the inventory item.
          schema:
            type: string
            example: INV-2026-0001
      responses:
        '200':
          description: Inventory item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      operationId: updateItem
      summary: Update inventory item
      description: Updates an existing inventory item.
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the inventory item.
          schema:
            type: string
            example: INV-2026-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInventoryItemPayload'
      responses:
        '200':
          description: Inventory item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          description: Invalid inventory item data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deleteItem
      summary: Delete inventory item
      description: Removes an inventory item from the system.
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the inventory item.
          schema:
            type: string
            example: INV-2026-0001
      responses:
        '204':
          description: Inventory item deleted successfully
        '404':
          description: Inventory item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inventory-transactions:
    get:
      operationId: getInventoryTransactions
      summary: Retrieve inventory transactions
      description: Returns the history of inventory quantity and status changes.
      parameters:
        - name: itemId
          in: query
          required: false
          description: Filter transactions by inventory item ID.
          schema:
            type: string
            example: INV-2026-0001
      responses:
        '200':
          description: Inventory transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryTransaction'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: createInventoryTransaction
      summary: Create inventory transaction
      description: Records a movement or change in inventory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInventoryTransactionPayload'
      responses:
        '201':
          description: Inventory transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTransaction'
        '400':
          description: Invalid transaction data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      operationId: getUsers
      summary: Retrieve system users
      description: Returns users who can access and manage the inventory system.
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: createUser
      summary: Create system user
      description: Creates a new user who can access the inventory system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserPayload'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InventoryItem:
      type: object
      required:
        - itemId
        - itemName
        - category
        - quantity
      properties:
        itemId:
          type: string
          example: INV-2026-0001
        itemName:
          type: string
          example: Dell OptiPlex Desktop Computer
        category:
          type: string
          example: Computer Equipment
        quantity:
          type: integer
          example: 25

    NewInventoryItemPayload:
      type: object
      required:
        - itemName
        - category
        - quantity
      properties:
        itemName:
          type: string
          example: Dell OptiPlex Desktop Computer
        category:
          type: string
          example: Computer Equipment
        quantity:
          type: integer
          example: 25

    InventoryTransaction:
      type: object
      required:
        - transactionId
        - itemId
        - transactionType
        - quantity
      properties:
        transactionId:
          type: string
          example: TXN-2026-0001
        itemId:
          type: string
          example: INV-2026-0001
        transactionType:
          type: string
          example: STOCK_IN
        quantity:
          type: integer
          example: 10

    NewInventoryTransactionPayload:
      type: object
      required:
        - itemId
        - transactionType
        - quantity
      properties:
        itemId:
          type: string
          example: INV-2026-0001
        transactionType:
          type: string
          example: STOCK_IN
        quantity:
          type: integer
          example: 10

    User:
      type: object
      required:
        - userId
        - fullName
        - email
        - role
      properties:
        userId:
          type: string
          example: USR-2026-0001
        fullName:
          type: string
          example: Maria Santos
        email:
          type: string
          example: maria.santos@college.edu
        role:
          type: string
          example: ADMIN

    NewUserPayload:
      type: object
      required:
        - fullName
        - email
        - password
        - role
      properties:
        fullName:
          type: string
          example: Maria Santos
        email:
          type: string
          example: maria.santos@college.edu
        password:
          type: string
          example: securePassword123
        role:
          type: string
          example: admin

    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource not found.