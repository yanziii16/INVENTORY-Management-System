openapi: 3.0.3
info:
  title: College Inventory Management System API
  description: REST API specification and contract for the college-based Inventory Management System (IMS).
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local Mock Development Server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealthStatus
      summary: Health Check Endpoint
      description: Returns the operational status of the server.
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              example:
                status: "ok"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      operationId: loginUser
      summary: User Login
      description: Authenticates user credentials and returns a JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "admin@idsc.edu.ph"
                password:
                  type: string
                  example: "Password123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                success: true
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  id: "usr-101"
                  name: "Admin User"
                  role: "Administrator"
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/signup:
    post:
      operationId: registerUser
      summary: Register New Account
      description: Creates a new user account for system access.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: "johndoe"
                email:
                  type: string
                  example: "johndoe@idsc.edu.ph"
                password:
                  type: string
                  example: "Password123!"
      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              example:
                success: true
                message: "User registered successfully."
        '400':
          $ref: '#/components/responses/BadRequest'

  /items:
    get:
      operationId: getAllItems
      summary: Get All Inventory Items
      description: Retrieves a list of all items in the inventory.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: "Cleaning Materials"
      responses:
        '200':
          description: List of inventory items
          content:
            application/json:
              example:
                success: true
                data:
                  - id: "itm-001"
                    sku: "CLN-001"
                    name: "Mop and Bucket Set"
                    category: "Cleaning Materials"
                    quantity: 12
                    unit: "pcs"
                    status: "In Stock"
                  - id: "itm-002"
                    sku: "UNI-006"
                    name: "PE Uniform"
                    category: "Uniforms & Apparel"
                    quantity: 350
                    unit: "pcs"
                    status: "Low Stock"
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createItem
      summary: Add New Inventory Item
      description: Creates a new inventory record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: Item created successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  /items/{id}:
    get:
      operationId: getItemById
      summary: Get Item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "itm-001"
      responses:
        '200':
          description: Item details
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ItemInput:
      type: object
      required:
        - name
        - category
        - quantity
      properties:
        sku:
          type: string
          example: "CLN-001"
        name:
          type: string
          example: "Mop and Bucket Set"
        category:
          type: string
          example: "Cleaning Materials"
        quantity:
          type: integer
          example: 12

  responses:
    BadRequest:
      description: Bad Request - Problem Details JSON (RFC 7807)
      content:
        application/json:
          example:
            type: "https://example.com/errors/bad-request"
            title: "Bad Request"
            status: 400
            detail: "Invalid parameters or missing required fields."
            instance: "/api/v1/items"

    NotFound:
      description: Resource Not Found - Problem Details JSON (RFC 7807)
      content:
        application/json:
          example:
            type: "https://example.com/errors/not-found"
            title: "Item Not Found"
            status: 404
            detail: "The item with the specified ID was not found."
            instance: "/api/v1/items/invalid-id"

    InternalServerError:
      description: Internal Server Error - Problem Details JSON (RFC 7807)
      content:
        application/json:
          example:
            type: "https://example.com/errors/internal-error"
            title: "Internal Server Error"
            status: 500
            detail: "An unexpected error occurred on the server."
            instance: "/api/v1/health"